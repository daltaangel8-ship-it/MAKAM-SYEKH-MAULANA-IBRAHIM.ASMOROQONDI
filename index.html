<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri & Wisata Makam Syekh Maulana Ibrahim Asmoroqondi Tuban</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'golden-batter': '#E8D1A7',
                        'olive-harvest': '#9D9167',
                        'toasted-caramel': '#84592B',
                        'spiced-wine': '#743014',
                        'cowhide-cocoa': '#442D1C',
                        'cream-light': '#F8F3EA',
                    },
                    fontFamily: {
                        'heading': ['Montserrat', 'sans-serif'],
                        'subheading': ['Cormorant Garamond', 'serif'],
                        'body': ['Libre Baskerville', 'serif'],
                        'script': ['Allura', 'cursive'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #E8D1A7;
            color: #442D1C;
            font-family: 'Libre Baskerville', serif;
        }

        .font-heading { font-family: 'Montserrat', sans-serif; font-weight: 800; }
        .font-subheading { font-family: 'Cormorant Garamond', serif; }
        .font-body { font-family: 'Libre Baskerville', serif; }
        .font-script { font-family: 'Allura', cursive; }

        .magazine-border {
            border: 1px solid #84592B;
            position: relative;
        }
        .magazine-border::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            right: 3px;
            bottom: 3px;
            border: 1px solid #9D9167;
            pointer-events: none;
        }
    </style>
</head>
<body class="antialiased selection:bg-spiced-wine selection:text-golden-batter min-h-screen flex flex-col">

    <!-- BAGIAN GALERI FOTO -->
    <section id="galeri" class="py-16 bg-cream-light border-t border-toasted-caramel/20">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="text-center mb-12">
                <span class="font-script text-3xl sm:text-4xl text-spiced-wine block">Dokumentasi Visual</span>
                <h2 class="font-heading text-2xl sm:text-4xl text-cowhide-cocoa uppercase tracking-tight">Galeri Foto Destinasi</h2>
                <div class="w-24 h-1 bg-spiced-wine mx-auto mt-3"></div>
            </div>

            <!-- Grid Foto Galeri -->
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                <!-- Foto 1 -->
                <div class="relative group cursor-pointer overflow-hidden rounded-xl shadow-lg border-2 border-toasted-caramel" 
                     onclick="openModal('Foto Gapura Asmoroqondi.jpg', 'Gapura Utama Asmoroqondi')">
                    <img src="Foto Gapura Asmoroqondi.jpg" 
                         alt="Gapura Utama Asmoroqondi" 
                         class="w-full h-64 object-cover transform group-hover:scale-110 transition-transform duration-500"
                         onerror="this.src='https://placehold.co/800x600/84592B/E8D1A7?text=Gapura+Asmoroqondi'">
                    <div class="absolute inset-0 bg-cowhide-cocoa/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center text-golden-batter">
                        <i class="fa-solid fa-magnifying-glass-plus text-3xl"></i>
                    </div>
                </div>

                <!-- Foto 2 -->
                <div class="relative group cursor-pointer overflow-hidden rounded-xl shadow-lg border-2 border-toasted-caramel" 
                     onclick="openModal('Foto makam asmoroqondi 6.jpg', 'Kompleks Makam')">
                    <img src="Foto makam asmoroqondi 6.jpg" 
                         alt="Kompleks Makam" 
                         class="w-full h-64 object-cover transform group-hover:scale-110 transition-transform duration-500"
                         onerror="this.src='https://placehold.co/800x600/84592B/E8D1A7?text=Makam+Asmoroqondi'">
                    <div class="absolute inset-0 bg-cowhide-cocoa/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center text-golden-batter">
                        <i class="fa-solid fa-magnifying-glass-plus text-3xl"></i>
                    </div>
                </div>

                <!-- Foto 3 -->
                <div class="relative group cursor-pointer overflow-hidden rounded-xl shadow-lg border-2 border-toasted-caramel" 
                     onclick="openModal('Foto makam asmoroqondi 9.jpg', 'Suasana Ziarah')">
                    <img src="Foto makam asmoroqondi 9.jpg" 
                         alt="Suasana Ziarah" 
                         class="w-full h-64 object-cover transform group-hover:scale-110 transition-transform duration-500"
                         onerror="this.src='https://placehold.co/800x600/84592B/E8D1A7?text=Suasana+Ziarah'">
                    <div class="absolute inset-0 bg-cowhide-cocoa/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center text-golden-batter">
                        <i class="fa-solid fa-magnifying-glass-plus text-3xl"></i>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- MODAL / LIGHTBOX (PERBAIKAN KODE KUNCI) -->
    <div id="imageModal" class="fixed inset-0 z-50 hidden bg-cowhide-cocoa/90 backdrop-blur-md flex items-center justify-center p-4 transition-all duration-300">
        <!-- Tombol Tutup (Atas Kanan) -->
        <button onclick="closeModal()" class="absolute top-6 right-6 text-golden-batter text-3xl hover:text-amber-300 transition-colors focus:outline-none">
            <i class="fa-solid fa-xmark"></i>
        </button>

        <!-- Kontainer Gambar Pop-up -->
        <div class="max-w-4xl w-full flex flex-col items-center">
            <!-- Tag img yang sudah diperbaiki -->
            <img id="modalImage" 
                 src="" 
                 alt="Gambar Diperbesar" 
                 class="max-h-[80vh] w-auto max-w-full rounded-xl shadow-2xl border-4 border-golden-batter object-contain">
            
            <p id="modalCaption" class="mt-4 text-golden-batter font-subheading text-xl text-center font-bold tracking-wide"></p>
            
            <button onclick="closeModal()" class="mt-4 px-6 py-2 bg-spiced-wine text-golden-batter font-heading text-xs uppercase tracking-widest rounded-lg hover:bg-toasted-caramel transition-colors">
                Tutup
            </button>
        </div>
    </div>

    <!-- JAVASCRIPT UNTUK FUNGSI MODAL -->
    <script>
        function openModal(imageSrc, captionText) {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImage');
            const modalCaption = document.getElementById('modalCaption');

            modalImg.src = imageSrc;
            modalCaption.innerText = captionText || 'Gambar Diperbesar';
            
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden'; // Menghindari scroll saat modal terbuka
        }

        function closeModal() {
            const modal = document.getElementById('imageModal');
            modal.classList.add('hidden');
            document.body.style.overflow = 'auto'; // Mengaktifkan scroll kembali
        }

        // Tutup modal jika area latar belakang hitam diklik
        document.getElementById('imageModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
    </script>
</body>
</html>
